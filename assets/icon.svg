<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed: iOS rounds the corners and Android masks it. The mark stays inside the
       central 80% circle, the maskable safe zone. -->
  <rect width="512" height="512" fill="#0f766e"/>
  <g fill="#ffffff">
    <rect x="168" y="128" width="64" height="256" rx="14"/>
    <rect x="168" y="128" width="184" height="64" rx="14"/>
    <rect x="168" y="228" width="140" height="58" rx="14"/>
  </g>
  <circle cx="340" cy="358" r="26" fill="#5eead4"/>
</svg>
